# Пингует задеплоенные сервисы, чтобы бесплатные инстансы не засыпали.
# Адреса задаются переменной репозитория KEEPALIVE_URLS (через пробел):
# Settings → Secrets and variables → Actions → Variables → New repository variable.
# Пример: https://lumen-diary.onrender.com/health https://lumen-diary.up.railway.app/health
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services
        env:
          URLS: ${{ vars.KEEPALIVE_URLS }}
        run: |
          if [ -z "$URLS" ]; then
            echo "KEEPALIVE_URLS is empty, nothing to ping"
            exit 0
          fi
          status=0
          for url in $URLS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then status=1; fi
          done
          exit $status
