# Fly.io для Lumen Diary: один образ (фронтенд + API) из Dockerfile.
# Деплой: Fly → Launch → выбрать репозиторий и ветку, Config path = fly.toml.
# Секретов нет.

app = "lumen-diary-kernel"  # имя должно быть уникальным на Fly; при занятости измените здесь и в форме
primary_region = "fra"       # ближайший регион к пользователям жюри; можно заменить

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  MAX_UPLOAD_MB = "10"
  MAX_PHOTOS = "5"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # не усыплять машину: демо и жюри открывают сайт в любой момент
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
