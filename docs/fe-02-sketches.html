<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Diary — три эскиза FE‑02</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f0e9; color: #231e19; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(100% - 32px, 420px); margin-inline: auto; padding: 32px 0; }
  header { margin-bottom: 24px; border-bottom: 1px solid #c8bfb1; padding-bottom: 20px; }
  h1 { margin: 0; font: 400 clamp(40px, 6vw, 76px)/1 Georgia, serif; letter-spacing: -.05em; }
  header p { margin: 12px 0 16px; color: #594d42; }
  .controls { display: flex; gap: 12px 24px; flex-wrap: wrap; font-size: 14px; }
  label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  input { accent-color: #4a3a2f; width: 16px; height: 16px; }
  .series { display: grid; grid-template-columns: minmax(0, 420px); justify-content: center; gap: 18px; }
  figure { margin: 0; }
  figcaption { padding: 12px 0; color: #594d42; font-size: 14px; }
  figcaption strong { display: block; color: #231e19; }
  .full-title { display: block; overflow-wrap: anywhere; }
  .card { position: relative; overflow: hidden; isolation: isolate; container-type: inline-size; aspect-ratio: 4 / 5;
    background: radial-gradient(ellipse at var(--light), var(--glow), transparent 64%), var(--paper); color: var(--ink); }
  .date, .photo, .line, .title, .signature, .grid { position: absolute; left: 6.666667%; width: 86.666667%; }
  .date, .signature { font: 400 2.6cqw/1 Consolas, "Courier New", monospace; letter-spacing: .12em; }
  .date { top: 5.333333%; }
  .photo { top: 12.444444%; height: 48.888889%; overflow: hidden; background: var(--scene); outline: 1px solid var(--edge); }
  .photo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--texture); opacity: var(--texture-opacity); }
  .photo::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at var(--light), var(--photo-glow), transparent 65%); }
  .motifs { position: absolute; inset: 0; overflow: hidden; }
  .motifs span { position: absolute; display: block; background: var(--mark); opacity: var(--mark-opacity); }
  .line { display: block; top: 64.444444%; height: 13.333333%; overflow: hidden; }
  .line path { stroke: var(--line); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  .line .halo { stroke: var(--halo); stroke-width: 13; }
  .title { top: 79.407407%; height: 11.555556%; margin: 0; font: 400 6.3cqw/1.05 Georgia, serif;
    letter-spacing: -.025em; overflow-wrap: anywhere; text-wrap: balance; }
  .title-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 2lh; overflow: hidden; }
  .signature { top: 93.333333%; }
  .grid { inset-block: 0; grid-template-columns: repeat(12, 1fr); gap: 2.222222cqw; display: none; pointer-events: none; }
  .grid i { background: #e1337833; border-inline: 1px solid #e133787a; }
  main:has(#show-grid:checked) .grid { display: grid; }
  main:has(#blind:checked) :is(.date, .title, figcaption) { visibility: hidden; }
  .calm { --paper: #182d33; --ink: #f8eee3; --light: 100% 38%; --glow: #576565; --photo-glow: #f5ddb570;
    --line: #ffca9c; --halo: #1b3032; --edge: #bdad98; --mark: #f9d8b0; --mark-opacity: .44; --texture-opacity: .65;
    --scene: linear-gradient(174deg, #42646b 0 54%, #5c7474 54% 58%, #2c494e 58% 68%, #193238 68%);
    --texture: repeating-linear-gradient(108deg, transparent 0 10px, #cee5d441 11px, transparent 12px 32px); }
  .calm .motifs span { height: 1px; border-radius: 50%; filter: blur(.35px); }
  .energy { --paper: #ffc059; --ink: #2e210d; --light: 0% 31%; --glow: #fff0b1; --photo-glow: #fff1a062;
    --line: #7a271d; --halo: #ffdd94; --edge: #7e411b; --mark: #fce6a1; --mark-opacity: .87; --texture-opacity: .29;
    --scene: linear-gradient(125deg, transparent 0 51%, #562925 51% 68%, #332a29 68% 82%, #251d24 82%),
      linear-gradient(151deg, #ffe7a3 0 41%, #ef982d 41% 60%, #b94d28 60%);
    --texture: radial-gradient(#41251f 17%, transparent 25%) 0 0 / 4px 4px; }
  .energy .motifs span { height: 2%; transform: skewY(-24deg); }
  .dense { --paper: #ccd0ec; --ink: #25233e; --light: 50% 100%; --glow: #e6d9f9; --photo-glow: #e2d9ff8c;
    --line: #42397b; --halo: #e0dcf5; --edge: #726e93; --mark: #302c59; --mark-opacity: .62; --texture-opacity: .85;
    --scene: linear-gradient(150deg, #656888, #b2bad7 46%, #777797 70%, #444361);
    --texture: radial-gradient(ellipse at 42% 62%, #ede8f9a6, transparent 65%),
      repeating-linear-gradient(90deg, transparent 0 4px, #e8e5ff2a 5px, transparent 6px 13px); }
  .dense .motifs span { height: var(--height); bottom: 7%; filter: blur(.45px); }
  @media (min-width: 898px) {
    main {
      --series-row-width: 858px;
      /* Keep 20px margins when the row fits, with 12.5px as the minimum. */
      width: min(1320px, 100% - 25px, max(100% - 40px, var(--series-row-width)));
      padding: 44px 0;
    }
    .series { grid-template-columns: repeat(2, minmax(0, 420px)); }
  }
  @media (898px <= width < 1336px) {
    .series > figure:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: min(100%, 420px); }
  }
  @media (min-width: 1336px) {
    main { --series-row-width: 1296px; }
    .series { grid-template-columns: repeat(3, minmax(0, 420px)); }
  }
</style>
</head>
